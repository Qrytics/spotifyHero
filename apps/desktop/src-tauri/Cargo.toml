[package]
name = "spotifyhero"
version = "0.0.1"
description = "spotifyHero – Spotify-driven rhythm overlay game"
authors = ["spotifyHero contributors"]
edition = "2021"

[lib]
name = "spotifyhero_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-store = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
anyhow = "1"
dotenvy = "0.15"
axum = "0.7"
sha2 = "0.10"
base64 = "0.22"
rand = "0.8"
webbrowser = "1"
urlencoding = "2"

[profile.release]
strip = true
opt-level = "z"
lto = true
